[project]
name = "contractdownloader"
version = "1.0.0"
description = "Contract Downloader — high-performance PO attachment download engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "extract-msg>=0.55.0",
    "fpdf2>=2.8.4",
    "httpx[http2]>=0.27.2",
    "lxml>=6.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyxlsb>=1.0.10",
    "pywebview>=6.2.1",
    "selenium>=4.30.0",
    "truststore>=0.10.0",
]

[project.scripts]
contract-downloader = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: marks tests as E2E integration tests requiring a real Coupa connection (deselect with '-m not integration')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "playwright>=1.59.0",
]
build = [
    "pyinstaller>=6.20.0",
]
all = [
    { include-group = "dev" },
    { include-group = "build" },
]
